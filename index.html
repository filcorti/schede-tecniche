<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schede Tecniche Corti</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A6B45">
<meta name="description" content="Archivio delle schede tecniche di produzione e calcolo del costo tessuto — Manifattura Corti.">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schede Corti">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Palette Material 3, tema chiaro soltanto: niente tema scuro, come chiesto. */
:root{
  --bg:#F6FBF4; --panel:#FFFFFF; --ink:#171D18; --ink-soft:#414942;
  --line:#DDE5DC; --verde:#2A6B45; --verde-soft:#D5E8D8; --ambra:#8A6A12;
  --ambra-soft:#FFEFC9; --accent:#2A6B45;
  --surf1:#F0F6EE; --surf2:#EAF0E8; --surf3:#E5EBE3;
  --prim-c:#ACF2C6; --on-prim-c:#00210F;
  --ter-c:#FFDEA6; --on-ter-c:#281900; --ter-l:#7A5900;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);
 font:14px/1.45 Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 display:flex;flex-direction:column}
/* ---------- guscio: una barra sola, due riquadri ---------- */
header{background:var(--bg);padding:22px max(12px,env(safe-area-inset-right,0px)) 12px
 max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:5}
.appbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 max-width:1480px;margin:0 auto;width:100%}
.marchio{width:auto;height:34px;display:block;flex:none;object-fit:contain}
.tit{min-width:0;flex:none}
.tit .t1{font-size:15px;font-weight:700;line-height:1.15}
.tit .t2{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;min-height:38px;padding:0;border-radius:999px;border:none;
 background:var(--surf2);color:var(--ink);cursor:pointer;display:flex;flex:none;
 align-items:center;justify-content:center}
.ib:hover{background:var(--verde-soft)}
#elenco[aria-pressed="true"]{background:var(--verde-soft);color:var(--verde)}
.ib.piatto{background:transparent;width:34px;height:34px;min-height:34px}
.ib svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.pill{flex:999 1 400px;min-width:0;display:flex;align-items:center;gap:2px;
 background:var(--surf2);border-radius:999px;padding:7px 5px 7px 15px;margin-left:4px}
.pill .lente{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-soft);
 stroke-width:1.9;stroke-linecap:round;margin-right:6px}
.fld{display:flex;flex-direction:column;gap:0;min-width:0;flex:1 1 76px;
 padding:1px 10px;border-left:1px solid var(--line)}
.fld:first-of-type{border-left:none}
.fld.dsc{flex:2 1 110px}
.fld label{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-soft)}
.fld input{font:500 14px/1.2 inherit;padding:0;width:100%;min-width:0;color:var(--ink);
 background:none;border:none;border-radius:0}
.fld input:focus{outline:none}
.fld:focus-within label{color:var(--verde)}
.conta{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none}
button{font:600 12.5px inherit;padding:10px 16px;min-height:38px;border:1px solid transparent;
 border-radius:999px;background:var(--surf3);color:var(--ink);cursor:pointer}
button:hover{background:var(--verde-soft)}
button.primary{background:var(--verde);color:#fff}
button.primary:hover{background:#1f5435}
main{flex:1;display:flex;gap:12px;min-height:0;width:100%;max-width:1480px;margin:0 auto;
 padding:4px max(12px,env(safe-area-inset-left,0px)) 14px}
#list{flex:0 0 220px;min-width:0;overflow:auto;background:var(--surf1);
 border-radius:20px;padding:6px}
main.solo #list,main.senza-elenco #list{display:none}
#list .it{padding:9px 12px;border-radius:14px;cursor:pointer;margin-bottom:3px}
#list .it:hover{background:var(--surf2)}
#list .it[aria-selected="true"]{background:var(--verde-soft)}
#list .cod{display:block;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;
 white-space:nowrap}
#list .it[aria-selected="true"] .cod{font-weight:700}
#list .ds{display:block;font-size:11px;color:var(--ink-soft);overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
#list .empty{padding:12px;color:var(--ink-soft);font-size:12.5px}
#view{flex:999 1 560px;min-width:0;overflow:auto;padding:0 2px 16px}
.wrap{max-width:1320px;margin:0 auto}
.vuoto-box{background:var(--surf1);border-radius:20px;min-height:min(380px,58vh);
 display:flex;align-items:center;justify-content:center;padding:34px 24px;text-align:center}
.vuoto-box .in{max-width:46ch}
.vuoto-box .bollo{width:96px;height:96px;border-radius:999px;background:var(--surf3);
 margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.vuoto-box .bollo svg{width:42px;height:42px;fill:none;stroke:var(--verde);stroke-width:1.5;
 stroke-linecap:round;stroke-linejoin:round}
.vuoto-box h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.vuoto-box p{margin:0 0 16px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.vuoto-box .azioni{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{color:var(--ink-soft);max-width:52ch;margin:40px auto;text-align:center;font-size:13px}
.drop{max-width:52ch;margin:40px auto;padding:28px 24px;border:2px dashed var(--line);
 border-radius:12px;text-align:center;background:var(--panel)}
.drop h2{margin:0 0 8px;font-size:17px}
.drop p{margin:0 0 16px;color:var(--ink-soft);font-size:13px;line-height:1.5}
.drop.over{border-color:var(--verde);background:var(--verde-soft)}
.err{color:var(--ambra);font-size:12.5px;margin-top:10px}
h1{font-size:21px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:12.5px;margin-bottom:14px}
.sub b{color:var(--ambra)}
.f{margin-bottom:9px}
.f label{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-soft);
 margin-bottom:3px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
 color:var(--ambra);background:rgba(154,116,22,.14);border-radius:4px;padding:1px 5px}
.f input,.f select{width:100%;font:600 15px/1.2 inherit;padding:8px 10px;color:var(--ink);
 background:var(--panel);border:1px solid var(--line);border-radius:7px}
.f input:focus,.f select:focus{outline:2px solid var(--verde);outline-offset:1px}
.arch{font-size:11px;color:var(--ink-soft);margin-top:3px}
/* ---------- pannello costo: Material 3 Expressive pieno ---------- */
.cap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.cap h1{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:0;
 font-variant-numeric:tabular-nums}
.cap .desc{font-size:14px;color:var(--ink-soft)}
.spec{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.sp{background:var(--surf3);border-radius:999px;padding:7px 14px;font-size:12.5px;
 color:var(--ink);display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.sp .k{color:var(--ink-soft)}
.sp .v{font-weight:700;font-variant-numeric:tabular-nums}
.cc{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cc-in{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:12px}
.duecol{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;
 align-items:stretch}
.cc-out{flex:0 1 296px;min-width:272px;position:sticky;top:0}
.pan{background:var(--surf1);border-radius:24px;padding:16px 16px 14px;
 display:flex;flex-direction:column}
.sh{font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px}
.sh-riga{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sh-riga .sh{margin:0}
.mini{font:600 11.5px/1 inherit;padding:7px 13px;min-height:0;border-radius:999px;
 background:var(--surf3);color:var(--ink-soft);flex:none}
.mini:hover{background:var(--verde-soft);color:var(--ink)}
.mini.caldo{background:var(--ambra-soft);color:var(--ambra)}
.unita{display:grid;grid-template-columns:minmax(0,1fr) 58px 92px 62px;gap:12px;
 padding:0 16px 8px;font-size:10px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-soft)}
.unita span{text-align:right}
.unita span:first-child{text-align:left}
.pan .f{margin-bottom:0}
.pan .f label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-soft);margin-bottom:6px}
.pan .f input{text-align:right;background:var(--panel);border:none;
 border-bottom:2px solid var(--verde);border-radius:12px 12px 4px 4px;
 font:500 14px/1.2 inherit;padding:9px 11px}
.tre{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
 flex:1 1 auto;align-content:space-between}
.riga{height:0;margin:12px 0 0}
.arch{font-size:11px;color:var(--ink-soft);margin-top:8px;padding:0 4px}
.arch-up{margin:0}
.tot{background:var(--prim-c);color:var(--on-prim-c);border-radius:24px;padding:16px 18px}
.sell{background:var(--ter-c);color:var(--on-ter-c);border-radius:24px;
 padding:14px 18px;margin-top:10px}
.et{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--ink-soft)}
.tot .et{color:var(--on-prim-c)}
.sell .et,.et-v{color:var(--on-ter-c)}
.big{display:flex;align-items:baseline;gap:9px;margin-top:4px}
.big>span{font-size:36px;font-weight:900;line-height:1;letter-spacing:-.03em;
 font-variant-numeric:tabular-nums}
.big em{font-style:normal;font-size:14px;font-weight:500}
.big-v>span{font-size:30px;line-height:1.05}
.small{display:flex;align-items:baseline;gap:9px;margin-top:3px}
.small>span{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.small em{font-style:normal;font-size:12px}
.bar{display:flex;gap:3px;height:10px;margin:12px 0 10px}
.bar i{display:block;border-radius:6px}
.leg{background:var(--panel);border-radius:18px;padding:4px 14px;color:var(--ink)}
.leg>div{display:grid;grid-template-columns:minmax(0,1fr) 58px 42px;gap:8px;
 align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.leg>div:last-child{border-bottom:none}
.leg>div>span{color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.leg b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.leg em{font-style:normal;color:var(--ink-soft);text-align:right;
 font-variant-numeric:tabular-nums}
.leg .vuoto{margin:0;padding:8px 0;font-size:12px;color:var(--ink-soft);line-height:1.45}
.dv{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dv label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--on-ter-c)}
.dv input{font:700 15px/1.2 inherit;padding:9px 12px;width:92px;text-align:right;
 color:var(--on-ter-c);background:var(--panel);border:none;
 border-bottom:2px solid var(--ter-l);border-radius:14px 14px 4px 4px;
 font-variant-numeric:tabular-nums}
.dv input:focus{outline:3px solid var(--ter-l);outline-offset:1px}
.vend{display:flex;align-items:baseline;gap:16px;margin-top:12px;flex-wrap:wrap}
.salva{background:var(--surf1);border-radius:24px;padding:14px 18px;margin-top:10px;
 display:flex;flex-direction:column}
.salva .due{display:flex;gap:10px;margin-top:10px}
.salva .due .f{flex:1 1 112px;min-width:0;margin-bottom:0}
.salva .due .f input{font-size:13.5px;padding:10px 12px;text-align:left}
.salva button{width:100%;margin-top:10px;padding:13px 20px;min-height:46px;
 font:600 13px/1 inherit;border-radius:999px}
.salva button[disabled]{opacity:.55;cursor:default}
.salva .arch{margin-top:5px;line-height:1.5;padding:0}
.salva .cima{flex:none}
.lnk{background:none;border:none;padding:0 0 0 8px;font:inherit;font-size:12px;
 color:var(--verde);text-decoration:underline;cursor:pointer;border-radius:0;min-height:0}
.lnk:hover{color:var(--ink);background:none}
/* storico */
.st{padding-top:0;margin-top:0;border-top:none}
.st-cap{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
 flex-wrap:wrap;margin-bottom:8px}
.st-cap .q{font-size:12px;color:var(--ink-soft)}
.st-box{background:var(--surf1);border-radius:24px;padding:6px;overflow:hidden}
.st-vuoto{padding:14px;font-size:13px;color:var(--ink-soft)}
.vr{background:var(--panel);border-radius:18px;margin-bottom:4px;overflow:hidden}
.vr:last-child{margin-bottom:0}
.vr .rg{display:grid;grid-template-columns:92px minmax(0,1fr) 88px 88px 62px 16px;gap:12px;
 align-items:center;padding:11px 15px;width:100%;text-align:left;background:none;border:none;
 border-radius:0;cursor:pointer;color:var(--ink);font:inherit;min-height:0}
.vr .rg:hover{background:var(--surf2)}
.vr.ap{background:var(--verde-soft)}
.vr.ap .rg:hover{background:transparent}
.vr .dt{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.vr .nt{min-width:0;font-size:12px;color:var(--ink-soft);overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap}
.vr .nc,.vr .np{text-align:right;font-size:13.5px;font-weight:700;white-space:nowrap;
 font-variant-numeric:tabular-nums}
.vr .np{color:var(--verde)}
.vr .nc em,.vr .np em{display:block;font-style:normal;font-size:9px;font-weight:600;
 color:var(--ink-soft);margin-top:1px}
.vr .dl{text-align:right}
.vr .dl span{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px}
.vr .dl .su{color:#7A3B13;background:var(--ter-c)}
.vr .dl .giu{color:var(--on-prim-c);background:var(--prim-c)}
.vr .dl .pari{font-size:11px;color:var(--ink-soft)}
.vr .fr{text-align:right;color:var(--ink-soft);font-size:12px}
.vd{padding:0 10px 10px}
.vd-box{background:var(--panel);border-radius:16px;padding:14px 16px}
.vd h4{margin:0 0 10px;font-size:10px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;color:var(--ink-soft)}
.vd h4 small{font-weight:500;letter-spacing:0;text-transform:none;font-size:11.5px;
 color:var(--ink-soft)}
.vd .vv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 22px;font-size:12.5px}
.vd .vv div{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
 padding:5px 0;border-bottom:1px solid var(--line)}
.vd .vv span{color:var(--ink-soft);min-width:0}
.vd .vv b{white-space:nowrap;font-variant-numeric:tabular-nums}
.vd .vv .cam{background:var(--ambra-soft);padding:5px 10px;border-radius:12px;
 border-bottom-color:transparent}
.vd .vv .cam span{color:var(--ink)}
.vd .vv em{display:block;font-style:normal;font-size:11px;color:var(--ter-l);
 margin-top:2px;font-weight:700}
.vd-pie{margin:12px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.45}
.vd .azioni{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.vd .azioni button{padding:12px 20px;min-height:44px;border-radius:999px;
 background:var(--verde-soft);border-color:transparent;color:var(--ink)}
.vd .azioni button:hover{background:var(--surf3)}

/* ---------- storico a confronto: una colonna per valutazione ---------- */
.st-cap .vista{margin-left:auto;display:flex;gap:6px}
.pillv{font:600 11.5px inherit;padding:7px 13px;min-height:0;border:none;
 border-radius:999px;background:var(--surf3);color:var(--ink-soft)}
.pillv.on{background:var(--verde);color:#fff}
.pillv.on:hover{background:#1f5435}
.tabst{overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;min-width:0;max-width:100%;
 --vo:200px;--ul:168px;--mc:118px}
.tabst .trg,.tabst .tsz{display:grid;gap:0 8px;align-items:center}
.tabst .trg>*{padding:5px 10px}
.tabst .vo{padding-left:6px;position:sticky;left:0;z-index:2;background:var(--surf1)}
.tabst .vo b{display:block;font-size:13px;font-weight:500;line-height:1.25}
.tabst .vo i{display:block;font-style:normal;font-size:10px;color:var(--ink-soft)}
.tabst .cel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;
 align-items:baseline;font-variant-numeric:tabular-nums}
.tabst .cel .p{text-align:right;font-size:11px;font-weight:600;color:var(--ink-soft);
 white-space:nowrap}
.tabst .cel .v{text-align:right;font-size:13.5px;font-weight:700;white-space:nowrap}
.tabst .ult{background:var(--verde-soft);position:sticky;left:var(--vo);z-index:1}
.tabst .primo .ult{border-radius:14px 14px 0 0}
.tabst .cam{background:var(--ambra-soft)}
.tabst .cam .p{color:var(--ambra)}
.tabst .tsz{margin-top:9px;border-bottom:1px solid rgba(23,29,24,.16)}
.tabst .tsz .et{padding:7px 6px 4px}
.tabst .tsz .ult{height:100%}
.tabst .int{border-bottom:1px solid var(--line);margin-bottom:2px}
.tabst .tes{text-align:right;font-size:12.5px;font-weight:700;line-height:1.2;
 padding:5px 10px 7px}
.tabst .tes small{display:block;font-weight:500;font-size:10.5px;color:var(--ink-soft);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabst .tes.ult{background:var(--prim-c);color:var(--on-prim-c);border-radius:14px 14px 0 0;
 z-index:3}
.tabst .tes.ult small{color:var(--on-prim-c)}
.tabst .cmd{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.tabst .cmd .lnk{font-size:10.5px;padding:0;text-decoration:underline}
.tabst .tes.ult .cmd .lnk{color:var(--on-prim-c)}
.tabst .somma{border-top:1px solid rgba(23,29,24,.10)}
.tabst .somma .vo b{font-weight:700}
.tabst .fine{margin-top:8px;padding-top:8px;border-top:2px solid rgba(23,29,24,.22)}
.tabst .fine .r2{border-top:1px solid rgba(23,29,24,.10)}
.tabst .fine .cel .v{font-size:18px;font-weight:900;letter-spacing:-.02em}
.tabst .fine .vo b{font-weight:700}
.tabst .fine .r1 .ult{background:var(--prim-c);color:var(--on-prim-c);border-radius:14px 14px 0 0}
.tabst .fine .r2 .ult{background:var(--ter-c);color:var(--on-ter-c);border-radius:0 0 14px 14px}
.tabst .fine .ult .p{color:inherit;opacity:.75}

/* ogni filato e' una scheda bianca; i numeri stanno insieme a destra e,
   se lo spazio manca, scendono sotto al nome invece di schiacciarlo */
.prow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
 background:var(--panel);border-radius:16px;padding:9px 12px;margin-bottom:7px}
.prow:last-of-type{margin-bottom:0}
.prow .pn{flex:1 1 110px;min-width:0}
.prow .pn .nm{display:block;font-size:14px;font-weight:500;line-height:1.2;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn i{display:block;font-size:11px;font-style:normal;color:var(--ink-soft);
 margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
 font-variant-numeric:tabular-nums}
.prow .pv{flex:0 0 auto;display:grid;grid-template-columns:46px 66px 50px;gap:8px;
 align-items:center;margin-left:auto}
.prow .pg{font-size:12px;color:var(--ink-soft);white-space:nowrap;text-align:right;
 font-variant-numeric:tabular-nums}
.prow input{font:500 13.5px/1.2 inherit;padding:8px 10px;width:100%;text-align:right;
 color:var(--ink);background:var(--surf2);border:none;

.sheet{width:210mm;max-width:100%;margin:0 auto;background:var(--paper);color:var(--paper-ink);

<script>

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function get(rec,n){ var v=rec?rec[n]:undefined; return v===undefined||v===null?'':v; }
function toF(v){
  if(typeof v==='number') return isFinite(v)?v:null;
  if(v===''||v==null) return null;
  var n=parseFloat(String(v).replace(/\s/g,'').replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n; }
function it(n,dec){
  var s=(dec==null? String(Math.round(n*1e6)/1e6) : n.toFixed(dec));
  return s.replace('.',','); }
function show(v){ return (typeof v==='number')?esc(it(v)):esc(v); }
function num(v,dec){ var n=toF(v); if(n===null) return show(v);
  return esc(dec==null? String(Math.round(n)) : it(n,dec)); }
function nz(v,dec){ var n=toF(v); if(n===null||n===0) return '';
  return esc(dec==null? String(Math.round(n)) : it(n,dec)); }
function box(val,lab,cls,sub){
  var t=String(val).replace(/<[^>]*>/g,'');

/* ---------- la scheda ---------- */
function card(rec){
  var g=function(n){ var v=get(rec,n);
    if(typeof v==='number' && v===0) return '';   // in FileMaker la casella era vuota
    return show(v); };
  var cap='';
  [['greggio',['h gg cap','fili cm gg cap','batt.cm gg cap','g mq gg cap','g ml fin cap'],
    ['cap alt gg','cap fili gg','cap bat gg','cap gr gg','cap gml gg']],
   ['finito',['h fin cap','fili cm fin cap','batt.cm fin cap','g mq fin cap','g ml gg cap'],
    ['cap alt fin','cap fili fin','cap bat fin','cap gr fin','cap gml fin']]
  ].forEach(function(b){
    var cells='';
    b[1].forEach(function(f,i){
      cells+='<div class="capcell"><b>'+(i>=3?num(get(rec,f),0):g(f))+'</b><i>'+g(b[2][i])+'</i></div>'; });
    cap+='<div class="caprow"><div class="caplab">'+b[0]+'</div>'+cells+'</div>'; });

  var COD={1:'codifica filato',2:'codifica filato2',3:'codifica filato3',4:'codifica filato4',

         box(nz(get(rec,kgf(n))),kgf(n),'sm')+box('','partita','sm')+box('','visto','sm'); });

  return '<div class="sheet">'+
  '<div class="frame"><div class="hdr"><div class="k">Articolo</div><div class="vv">'+g('Articolo')+
   '</div><div class="k">Altezza</div><div class="vv">'+g('Altezza')+
   '</div><div class="k">Colore</div><div class="vv">'+g('Colore')+'</div></div></div>'+
  '<div class="row" style="grid-template-columns:1fr 52mm"><div>'+
   '<div class="frame" style="padding:1.4mm 1.4mm .6mm">'+cap+
    '<div class="capfoot"><div></div><div>altezza/cm</div><div>fili/cm</div>'+
    '<div>inserzioni/cm</div><div>g/m&sup2;</div><div>g/m</div></div></div>'+
   '<div class="frame" style="display:grid;grid-template-columns:52mm 1fr;gap:1.2mm">'+
    box(g('Armatura'),'Armatura')+box(g('descrizione'),'Descrizione')+'</div></div>'+
   '<div class="side">'+box(g('Nr.subbio'),'Nr subbio')+box(g('Telaio'),'Telaio')+
    box(g('Data'),'Data')+box(g('Cliente'),'Cliente')+
    '<div class="firma"><div>RP</div><div>RMP</div></div>'+
    '<div style="font-size:6.6pt;font-weight:700;text-align:center">Firma Responsabili</div>'+
   '</div></div>'+
  '<div class="frame blu">'+
   '<div class="row" style="grid-template-columns:20mm 1fr 1fr 1fr 1.4fr">'+
    '<div class="lab-left" style="font-size:12pt;color:var(--blu)">ORDITO</div>'+
    box(g('ordito fibra'),'fibra')+box(g("ordito qualita'"),"qualita'")+
    box(g('ordito titolo'),'titolo','','&nbsp;'+g('ordito count'))+
    box(g('ordito colore'),'colore','','&nbsp;&nbsp;tit.rif. '+g('ordito tit rif'))+'</div>'+
   '<div class="row" style="grid-template-columns:20mm 1fr 1fr 1fr 1.4fr">'+

  '</div>'+
  filati+
  '<div class="big-empty"><div class="nota">'+esc(String(get(rec,'no')||'').trim())+

/* ---------- pannello costo ---------- */
var eur=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});

var VISTA_ST='conf';
try{ if(localStorage.getItem('storico_vista')==='lista') VISTA_ST='lista'; }catch(e){}
var MAN={calo:3,ordit:0,tar:'',fin1:'',fin2:'',fin3:'',divis:'0.86'};

/* prezzi dei filati, tenuti per codifica: riaprendo un altro articolo che
   usa lo stesso filato il prezzo e' gia' li'. Restano su questo browser. */
var PRZ={}, FILI=[], STORICO=[], UTENTE='', ULT={};
try{ PRZ=JSON.parse(localStorage.getItem('prezzi_filati')||'{}')||{}; }catch(e){ PRZ={}; }
try{ var sm=JSON.parse(localStorage.getItem('voci_costo')||'null');
     if(sm) for(var kk in sm) if(MAN.hasOwnProperty(kk)) MAN[kk]=sm[kk]; }catch(e){}
function salvaPrezzi(){
  try{ localStorage.setItem('prezzi_filati',JSON.stringify(PRZ));
       localStorage.setItem('voci_costo',JSON.stringify(MAN)); }catch(e){} }

/* I filati che compongono l'articolo, ognuno col suo peso al metro.
   I 'gr1..gr10' dell'archivio sono al netto dell'imborso e non sommano al
   peso ordito calcolato: li uso come proporzioni e li ridistribuisco sul
   peso totale, cosi' la somma torna sempre. Stessa cosa per le due trame. */
function filatiCosto(){
  var COD={1:'codifica filato',2:'codifica filato2',3:'codifica filato3',4:'codifica filato4',
           5:'codifica filato5',6:'codifica filato6',7:'codifica filato 11',8:'codifica filato 12',
           9:'codifica filato 9',10:'codifica filato 10'};
  var o=[], t=[], n;
  for(n=1;n<=10;n++){
    var gr=V('gr'+n)||0;
    if(gr>0) o.push({ruolo:'ordito',n:n,nome:T('colore filato '+n),cod:T(COD[n]),peso:gr*1000}); }
  if(!o.length) o.push({ruolo:'ordito',n:0,nome:T('colore filato 1')||T('ordito colore')||'ordito',
                        cod:T(COD[1]),peso:1});
  [1,2].forEach(function(i){
    var k=V('kg tr'+i)||0;
    if(k>0) t.push({ruolo:'trama',n:i,nome:T('colore  tr'+i),
                    cod:T(i===1?'codifica filato7':'codifica filato8'),peso:k}); });
  if(!t.length) t.push({ruolo:'trama',n:1,nome:T('colore  tr1')||'trama',
                        cod:T('codifica filato7'),peso:1});
  var tutti=o.concat(t);
  [o,t].forEach(function(g){
    var s=0; g.forEach(function(f){ s+=f.peso; });
    g.forEach(function(f){ f.q = s>0 ? f.peso/s : 0; }); });
  tutti.forEach(function(f,i){ f.id='pz'+i; f.k = f.cod || (f.ruolo+f.n); });
  return tutti; }

  elView.innerHTML=h;
  ['calo','ordit','tar','fin1','fin2','fin3','divis'].forEach(function(id){

  /* Lo stesso filato puo' stare in ordito e in trama: ha una codifica sola,
     quindi un prezzo solo. Scrivendolo da una parte si allinea l'altra. */
  FILI.forEach(function(f){
    var e=$(f.id); if(!e) return;
    e.addEventListener('input',function(){
      PRZ[f.k]=e.value;
      FILI.forEach(function(g){

      salvaPrezzi(); calc(); }); });
  $('s-salva').addEventListener('click',salvaValutazione);

/* Pulsanti "Azzera": servono due clic. I prezzi sono scritti a mano e un
   tocco di troppo li butterebbe via, quindi il primo clic chiede conferma. */
function azzeratore(id,pulisci){
  var b=$(id); if(!b) return;
  var pronto=false, t=null;
  function calmo(){ pronto=false; b.textContent='Azzera'; b.classList.remove('caldo');
                    if(t){ clearTimeout(t); t=null; } }
  b.addEventListener('click',function(){
    if(!pronto){ pronto=true; b.textContent='Confermi?'; b.classList.add('caldo');
                 t=setTimeout(calmo,5000); return; }
    calmo();
    var msg=pulisci();
    salvaPrezzi(); calc();
    var m=$('s-msg'); if(m && msg) m.textContent=msg; }); }

/* ---------- storico delle valutazioni ---------- */
function oggi(){ var d=new Date();
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function dataIt(s){ var p=String(s||'').slice(0,10).split('-');
  return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : esc(s); }
function quando(s){
  var p=String(s||'').slice(0,10).split('-'); if(p.length!==3) return '';
  var n=new Date(), oggiMez=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  var g=Math.round((oggiMez-new Date(+p[0],+p[1]-1,+p[2]).getTime())/86400000);
  if(g<0) return 'con data futura'; if(g===0) return 'oggi'; if(g===1) return 'ieri';
  return g+' giorni fa'; }

/* La fotografia da congelare: non solo i quattro numeri, ma come ci si e'
   arrivati. Fra sei mesi e' l'unica cosa che spiega perche' il prezzo
   e' cambiato. */
function istantanea(){
  var f=[];
  FILI.forEach(function(x){
    var e=$(x.id), p=e?parseFloat(String(e.value).replace(',','.')):NaN;
    f.push({ ruolo:x.ruolo, n:x.n, nome:x.nome, cod:x.cod, k:x.k,
             gm:+(x.q*(x.ruolo==='ordito'?ULT.pOrd:ULT.pTr)).toFixed(3),
             prezzo:isNaN(p)?0:p }); });
  return { filati:f, calo:inp('calo'), ordit:inp('ordit'), tar:inp('tar'),
           battute:ULT.batt, fin:[inp('fin1'),inp('fin2'),inp('fin3')],
           peso_ordito:ULT.pOrd, peso_trama:ULT.pTr, altezza_finita:ULT.altF,
           voci:{ materie_prime:ULT.mp, calo:ULT.cCalo, orditura:ULT.cOrdit,
                  tessitura:ULT.cTess, finissaggi:ULT.cFin } }; }

function salvaValutazione(){
  if(!REC) return;
  var b=$('s-salva'), msg=$('s-msg');
  if(!(ULT.cTot>0)){ msg.textContent='Prima inserisci i prezzi: non c’è ancora un costo da salvare.';
    return; }
  b.disabled=true; b.textContent='Salvo…';
  sb.from('valutazioni').insert({
    articolo:T('Articolo'), altezza:T('Altezza'), colore:T('Colore'),
    id_record:T('ID record'),
    data:$('s-data').value||oggi(), nota:$('s-nota').value.trim()||null,
    utente:UTENTE||null,
    costo_ml:+ULT.cTot.toFixed(4), costo_mq:+ULT.cTotQ.toFixed(4),
    prezzo_ml:+ULT.pVen.toFixed(4), prezzo_mq:+ULT.pVenQ.toFixed(4),
    divisore:inp('divis'), dettaglio:istantanea()
  }).then(function(res){
    b.disabled=false; b.textContent='Salva valutazione';
    if(res.error){ msg.textContent='Non sono riuscito a salvare: '+res.error.message; return; }
    $('s-nota').value='';
    msg.textContent='Salvata. La trovi nello storico qui accanto.';
    caricaStorico(); }); }

function caricaStorico(){
  var box=$('storico'); if(!box||!REC) return;
  sb.from('valutazioni')
    .select('id,data,nota,utente,costo_ml,costo_mq,prezzo_ml,prezzo_mq,divisore,dettaglio')
    .eq('articolo',T('Articolo')).eq('altezza',T('Altezza')).eq('colore',T('Colore'))
    .order('data',{ascending:false}).order('id',{ascending:false}).limit(60)
    .then(function(res){
      if(res.error){ box.innerHTML='<div class="st"><div class="st-box">'+
        '<div class="st-vuoto">Lo storico non si carica: '+esc(res.error.message)+'</div>'+
        '</div></div>'; return; }
      STORICO=res.data||[]; disegnaStorico(); }); }


/* Lo storico messo a confronto: una riga per voce, una colonna per valutazione.
   A sinistra di ogni numero il valore con cui e' stata fatta la valutazione
   (prezzo al kg, percentuale di calo, tariffa), a destra quanto pesa sul metro. */
function tabellaStorico(){
  var cols=STORICO;
  var chiavi=[], mappa={};
  function agg(f){ var k=f.ruolo+'#'+(f.n||1);
    if(!mappa[k]) { mappa[k]=f; chiavi.push(k); } }
  FILI.forEach(function(f){ agg({ruolo:f.ruolo,n:f.n,nome:f.nome,cod:f.cod,q:f.q}); });
  cols.forEach(function(v){ ((v.dettaglio||{}).filati||[]).forEach(agg); });
  chiavi.sort(function(a,b){ var A=mappa[a], B=mappa[b];
    if(A.ruolo!==B.ruolo) return A.ruolo==='ordito'?-1:1;
    return (A.n||1)-(B.n||1); });

  function fil(v,k){
    var l=(v.dettaglio||{}).filati||[];
    for(var i=0;i<l.length;i++) if(l[i].ruolo+'#'+(l[i].n||1)===k) return l[i];
    return null; }
  function somma(v,ruolo){
    var l=(v.dettaglio||{}).filati||[], s=0, c=0;
    l.forEach(function(f){ if(f.ruolo===ruolo){ s+=f.gm/1000*f.prezzo; c++; } });
    return c?s:null; }
  function E(x){ return (x||x===0)?eur.format(x)+' \u20ac':'\u2013'; }

  /* ogni riga e' un elenco di coppie [parametro, valore] lungo quanto le colonne */
  function riga(nome,sub,coppie,extra){
    var cam = cols.length>1 && coppie.length>1 &&
              (coppie[0][0]+'|'+coppie[0][1]) !== (coppie[1][0]+'|'+coppie[1][1]);
    var h='<div class="trg'+(extra?' '+extra:'')+'">'+
      '<div class="vo"><b>'+nome+'</b>'+(sub?'<i>'+sub+'</i>':'')+'</div>';
    coppie.forEach(function(c,i){
      h+='<div class="cel'+(i===0?' ult':'')+(cam&&i===0?' cam':'')+'">'+
         '<span class="p">'+(c[0]||'')+'</span><span class="v">'+c[1]+'</span></div>'; });
    return h+'</div>'; }
  function sez(t){
    var h='<div class="tsz"><div class="et">'+t+'</div>';
    cols.forEach(function(v,i){ h+='<div'+(i===0?' class="ult"':'')+'></div>'; });
    return h+'</div>'; }

  var h='<style>#storico .tabst .trg,#storico .tabst .tsz{'+
        'grid-template-columns:var(--vo) var(--ul) repeat('+Math.max(cols.length-1,0)+
        ',minmax(var(--mc),1fr))}</style>'+
        '<div class="tabst">';

  /* intestazione: data, nota e i comandi della colonna */
  h+='<div class="trg int"><div class="vo"></div>';
  cols.forEach(function(v,i){
    var cap=[]; if(v.nota) cap.push(esc(v.nota));
    if(v.utente) cap.push(esc(String(v.utente).split('@')[0]));
    h+='<div class="tes'+(i===0?' ult':'')+'">'+dataIt(v.data)+
       '<small>'+(cap.join(' \u00b7 ')||'&nbsp;')+'</small>'+
       '<span class="cmd"><button type="button" class="lnk" data-ric="'+i+'">ricarica</button>'+
       '<button type="button" class="lnk" data-del="'+i+'">elimina</button></span></div>'; });
  h+='</div>';

  var ord=chiavi.filter(function(k){ return mappa[k].ruolo==='ordito'; });
  var tra=chiavi.filter(function(k){ return mappa[k].ruolo!=='ordito'; });

  function blocco(lista,titolo,ruolo,etichetta){
    if(!lista.length) return '';
    var b=sez(titolo), primo=true;
    lista.forEach(function(k){
      var m=mappa[k];
      var sub=m.ruolo+(m.n?' '+m.n:'')+(m.cod?' \u00b7 '+esc(m.cod):'');
      b+=riga(esc(m.nome)||'&ndash;', sub, cols.map(function(v){
        var f=fil(v,k);
        return f ? [eur.format(f.prezzo), E(f.gm/1000*f.prezzo)] : ['','\u2013']; }),
        primo?'primo':''); primo=false; });
    b+=riga(etichetta,'\u20ac/m', cols.map(function(v){
      return ['', E(somma(v,ruolo))]; }), 'somma');
    return b; }

  h+=blocco(ord,'Ordito','ordito','Totale ordito');
  h+=blocco(tra,'Trama','trama','Totale trama');

  h+=sez('Lavorazioni');
  h+=riga('Calo','% sulle materie prime', cols.map(function(v){
    var d=v.dettaglio||{};
    return [nf.format(d.calo||0)+' %', E((d.voci||{}).calo)]; }));
  h+=riga('Orditura','\u20ac/kg sul peso ordito', cols.map(function(v){
    var d=v.dettaglio||{};
    return [eur.format(d.ordit||0), E((d.voci||{}).orditura)]; }));
  var batt=(cols[0].dettaglio||{}).battute||0;
  h+=riga('Tessitura','tariffa battuta'+(batt?' \u00d7 '+nf.format(batt):''),
    cols.map(function(v){ var d=v.dettaglio||{};
      return [fine.format(d.tar||0), E((d.voci||{}).tessitura)]; }));
  [0,1,2].forEach(function(j){
    h+=riga('Finissaggio '+(j+1),'\u20ac/m', cols.map(function(v){
      var x=((v.dettaglio||{}).fin||[])[j];
      return ['', x? E(x) : '\u2013']; })); });

  h+='<div class="fine">'+
     riga('Costo totale','\u20ac/m lineare \u00b7 \u20ac/m\u00b2', cols.map(function(v){
       return [eur.format(v.costo_mq||0)+' \u20ac/m\u00b2', E(v.costo_ml)]; }),'r1')+
     riga('Prezzo di vendita','divisore '+nf.format(cols[0].divisore||0), cols.map(function(v){
       return [eur.format(v.prezzo_mq||0)+' \u20ac/m\u00b2', E(v.prezzo_ml)]; }),'r2')+
     '</div>';
  return h+'</div>'; }

function disegnaStorico(){
  var box=$('storico'); if(!box) return;
  var n=STORICO.length;
  var ri=$('st-ri');
  if(ri) ri.textContent = n ? (n+(n===1?' valutazione':' valutazioni')+
        ' \u00b7 l\u2019ultima '+quando(STORICO[0].data)) : 'nessuna valutazione salvata';
  var tutteAperte = n>0 && STORICO.every(function(x){ return x.aperta; });
  var testa='<div class="st"><div class="st-cap">'+
    '<button type="button" class="ib piatto solo-tel chiudi-st" id="chiudi-st" '+
      'aria-label="Torna al calcolo"><svg viewBox="0 0 24 24" aria-hidden="true">'+
      '<path d="M15 5l-7 7 7 7"/></svg></button>'+
    '<h2 class="sh">Storico di questo articolo</h2><span class="q">'+
    (n? (n+(n===1?' valutazione':' valutazioni')+' · l’ultima '+quando(STORICO[0].data)) :
        'nessuna valutazione salvata')+
    (n>1 && VISTA_ST==='lista' ?
          ' <button type="button" class="lnk" id="st-tutte">'+
          (tutteAperte?'chiudi tutte':'apri tutte')+'</button>' : '')+
    '</span>'+
    (n? '<span class="vista">'+
        '<button type="button" class="pillv'+(VISTA_ST==='conf'?' on':'')+
          '" id="st-conf">Confronto</button>'+
        '<button type="button" class="pillv'+(VISTA_ST==='lista'?' on':'')+
          '" id="st-lista">Elenco</button></span>' : '')+
    '</div><div class="st-box">';
  if(!n){ box.innerHTML=testa+'<div class="st-vuoto">Quando salvi una valutazione '+
    'la ritrovi qui, con la composizione di quel giorno.</div></div></div>';
    collegaStorico(box); return; }

    '<p class="nota">Ogni valutazione congela i prezzi dei filati, le lavorazioni e il '+
    'divisore di quel giorno. Lo scostamento è sul costo rispetto alla valutazione '+

  function vista(id,quale){

        if(res.error){ b.disabled=false; b.textContent='Elimina';
          b.dataset.sicuro=''; alert('Non eliminata: '+res.error.message); return; }
        caricaStorico(); }); }); }); }

/* Confronto con la valutazione precedente per data: le voci che sono
   cambiate vengono marcate, con accanto quanto valevano prima. */
function dettaglio(v,i){
  var d=v.dettaglio||{}, pre=STORICO[i+1], p=pre?(pre.dettaglio||{}):null, r=[];
  var pf={}; if(p) (p.filati||[]).forEach(function(f){ if(f.k!=null) pf[f.k]=f; });
  var diverso=function(a,b){ return Math.abs((+a||0)-(+b||0))>1e-9; };

  (d.filati||[]).forEach(function(f){
    var old=p?pf[f.k]:null, era=null;
    if(p){
      if(!old) era='filato nuovo rispetto alla volta prima';
      else if(diverso(old.prezzo,f.prezzo))
        era='era '+eur.format(old.prezzo||0)+' €/kg'+
            ((+f.prezzo||0)>(+old.prezzo||0)?' ↑':' ↓');
      else if(diverso(old.gm,f.gm)) era='era '+nf.format(old.gm||0)+' g/m'; }
    r.push([esc(f.nome||'–')+' · '+nf.format(f.gm||0)+' g/m × '+
            eur.format(f.prezzo||0)+' €/kg', (f.gm||0)/1000*(f.prezzo||0), era]); });

  var vo=d.voci||{};
  var cam=function(ora,prima,testo){
    if(!p || !diverso(ora,prima)) return null;
    return 'era '+testo+((+ora||0)>(+prima||0)?' ↑':' ↓'); };
  if(d.calo) r.push(['Calo '+nf.format(d.calo)+'%', vo.calo,
    cam(d.calo,p&&p.calo,p?nf.format(p.calo||0)+'%':'')]);
  if(d.ordit) r.push(['Orditura '+eur.format(d.ordit)+' €/kg', vo.orditura,
    cam(d.ordit,p&&p.ordit,p?eur.format(p.ordit||0)+' €/kg':'')]);
  if(d.tar) r.push(['Tessitura '+fine.format(d.tar)+' € × '+nf.format(d.battute||0),
    vo.tessitura, cam(d.tar,p&&p.tar,p?fine.format(p.tar||0)+' €':'')]);
  if(vo.finissaggi){
    var fs=function(x){ return (x||[]).map(function(y){ return eur.format(y||0); }).join(' + '); };
    r.push(['Finissaggi '+fs(d.fin), vo.finissaggi,
      cam(vo.finissaggi, p&&(p.voci||{}).finissaggi, p?fs(p.fin):'')]); }

  var vv='';
  r.forEach(function(x){ vv+='<div'+(x[2]?' class="cam"':'')+'><span>'+x[0]+
    (x[2]?'<em>'+x[2]+'</em>':'')+'</span><b>'+eur.format(x[1]||0)+' €</b></div>'; });

  var sott = p ? 'Com’era composta <small>— in evidenza le voci cambiate rispetto al '+
                 dataIt(pre.data)+'</small>'
               : 'Com’era composta <small>— è la prima valutazione di questo articolo</small>';
  return '<div class="vd"><div class="vd-box"><h4>'+sott+'</h4>'+
    '<div class="vv">'+vv+'</div>'+
    '<p class="vd-pie">Costo '+eur.format(v.costo_ml||0)+' €/m · '+
      eur.format(v.costo_mq||0)+' €/m² — divisore '+nf.format(v.divisore||0)+
      ' → vendita '+eur.format(v.prezzo_ml||0)+' €/m · '+
      eur.format(v.prezzo_mq||0)+' €/m²</p>'+
    '<div class="azioni">'+
      '<button type="button" data-ric="'+i+'">Ricarica questi valori</button>'+
      '<button type="button" data-del="'+i+'">Elimina</button>'+
    '</div></div></div>'; }

/* Rimette nel calcolo i valori di una valutazione passata. Non tocca
   l'archivio: cambia solo quello che hai davanti. */
function ricarica(v){
  var d=v.dettaglio||{};
  (d.filati||[]).forEach(function(f){
    if(f.k==null) return;
    PRZ[f.k]=String(f.prezzo==null?'':f.prezzo);
    FILI.forEach(function(x){ if(x.k===f.k){ var e=$(x.id); if(e) e.value=PRZ[f.k]; } }); });
  var met={calo:d.calo, ordit:d.ordit, tar:d.tar,
           fin1:(d.fin||[])[0], fin2:(d.fin||[])[1], fin3:(d.fin||[])[2],
           divis:v.divisore};
  for(var id in met){ var e=$(id);
    if(e && met[id]!=null) e.value=met[id]; }
  salvaPrezzi(); calc();
  var m=$('s-msg');
  if(m) m.textContent='Ripresi i valori del '+dataIt(v.data)+'. Non è ancora salvato niente.';
  if(elView.scrollTo) elView.scrollTo({top:0,behavior:'smooth'}); }

var VOCI=[
  ['materie prime', '#2f7d52'],
  ['calo',          '#a8862a'],
  ['orditura',      '#7a7f82'],
  ['tessitura',     '#3f6ea8'],
  ['finissaggio 1 + 2', '#a85f38'],
  ['finissaggio 3',     '#c99069']
];

function calc(){
  if(!REC) return;
  ['calo','ordit','tar','fin1','fin2','fin3','divis'].forEach(function(id){
    var e=$(id); if(e) MAN[id]=e.value; });
  salvaPrezzi();
  var pOrd=V('ord')||V('ord2')||0, pTr=V('Tra 100')||V('Tra')||0,
      batt=V('battute')||V('batt.cm fin cap')||0;
  var cOrd=0, cTr=0;
  FILI.forEach(function(f){
    var e=$(f.id); if(!e) return;
    var prezzo=parseFloat(String(e.value).replace(',','.')); if(isNaN(prezzo)) prezzo=0;
    var gm=f.q*(f.ruolo==='ordito'?pOrd:pTr), c=gm/1000*prezzo;
    if(f.ruolo==='ordito') cOrd+=c; else cTr+=c;
    var g=$(f.id+'g'); if(g) g.textContent=nf.format(gm);
    var p=$(f.id+'c'); if(p) p.textContent=prezzo?eur.format(c):'–'; });
  var mp=cOrd+cTr;
  var cCalo=mp*inp('calo')/100;
  var cOrdit=pOrd/1000*inp('ordit');
  var cTess=inp('tar')*batt;
  var cFin=inp('fin1')+inp('fin2')+inp('fin3');
  var cTot=mp+cCalo+cOrdit+cTess+cFin;
  var altM=(V('h fin cap')||V('h gg cap')||0)/100;
  var cTotQ=altM>0?cTot/altM:0;
  var d=inp('divis');
  var pVen=d>0?cTot/d:0, pVenQ=(altM>0&&d>0)?pVen/altM:0;
  ULT={ pOrd:pOrd, pTr:pTr, batt:batt, altF:altM*100, mp:mp, cCalo:cCalo, cOrdit:cOrdit,
        cTess:cTess, cFin:cFin, cTot:cTot, cTotQ:cTotQ, pVen:pVen, pVenQ:pVenQ };

  var E=function(v){ return v>0?(eur.format(v)+' €'):'–'; };
  var scrivi=function(id,v){ var e=$(id); if(e) e.textContent=E(v); };
  scrivi('cTot',cTot); scrivi('cTotQ',cTotQ); scrivi('pVen',pVen); scrivi('pVenQ',pVenQ);
  /* gli stessi due numeri nella barra in fondo, quella del telefono */
  scrivi('rCost',cTot); scrivi('rVen',pVen);

  /* nello specchietto il finissaggio 1 e il 2 viaggiano insieme;
     restano due caselle distinte da compilare. */
  var q=[mp,cCalo,cOrdit,cTess,inp('fin1')+inp('fin2'),inp('fin3')], barra='', leg='';
  if(cTot>0){
    VOCI.forEach(function(v,i){
      if(!(q[i]>0)) return;
      var p=q[i]/cTot*100;
      barra+='<i style="width:'+p.toFixed(2)+'%;background:'+v[1]+'"></i>';
      leg+='<div><span><i style="background:'+v[1]+'"></i>'+v[0]+'</span>'+
           '<b>'+eur.format(q[i])+' €</b>'+
           '<em>'+p.toFixed(1).replace('.',',')+'%</em></div>'; });
  } else {
    leg='<p class="vuoto">Inserisci i prezzi dei filati per vedere la ripartizione.</p>'; }
  if($('bar')) $('bar').innerHTML=barra;
  if($('leg')) $('leg').innerHTML=leg;
}

function eseguiRicerca(){
  var a=qa.value.trim(), b=ql.value.trim(), c=qc.value.trim(), t=qt.value.trim();
  if(!a && !b && !c && !t){
    hits=[]; sel=-1; corpo.classList.add('solo'); elList.innerHTML='';
    top.classList.add('senza');
    elView.classList.remove('costo');
    elView.innerHTML=vuotoBox('Cerca una scheda',
      'Scrivi nei campi qui sopra: articolo, altezza, colore o un pezzo di descrizione. '+
      'I filtri si combinano fra loro.',
      '<button type="button" class="primary" data-es="art">Prova con 8000</button>'+
      '<button type="button" data-es="txt">Prova con Novosol</button>');
    elView.querySelectorAll('[data-es]').forEach(function(bt){
      bt.addEventListener('click',function(){
        if(bt.dataset.es==='art'){ qa.value='8000'; qa.focus(); }
        else { qt.value='Novosol'; qt.focus(); }
        eseguiRicerca(); }); });
    elCount.textContent=''; return; }
  var q=sb.from('schede').select('id,id_record,articolo,altezza,colore,descrizione');
  if(a) q=q.ilike('articolo', a+'%');
  if(b) q=q.ilike('altezza', b+'%');
  if(c) q=q.ilike('colore', c+'%');
  if(t) q=q.ilike('descrizione', '%'+t+'%');
  q.order('articolo').order('altezza').order('colore').limit(300)
   .then(function(res){
      if(res.error){ elList.innerHTML='<div class="empty">Errore: '+esc(res.error.message)+'</div>'; return; }
      hits=res.data||[];
      var ex=function(r){ var n=0;
        if(a && String(r.articolo).toLowerCase()===a.toLowerCase()) n++;
        if(b && String(r.altezza).toLowerCase()===b.toLowerCase()) n++;
        if(c && String(r.colore).toLowerCase()===c.toLowerCase()) n++; return n; };
      hits.sort(function(x,y){ return ex(y)-ex(x); });
      elCount.textContent=hits.length+(hits.length>=300?'+':'')+
        (hits.length===1?' scheda trovata':' schede trovate');
      if(!hits.length){
        corpo.classList.add('solo'); elList.innerHTML='';
        top.classList.add('senza');
        elView.classList.remove('costo');
    elView.innerHTML=vuotoBox('Nessuna scheda con questi filtri',
          'Prova a togliere un filtro, o a cercare un pezzo di descrizione invece del codice.',
          '<button type="button" class="primary" id="az2">Azzera i filtri</button>');
        var az=document.getElementById('az2');
        if(az) az.addEventListener('click',function(){
          qa.value=ql.value=qc.value=qt.value=''; qa.focus(); eseguiRicerca(); });
        return; }
      corpo.classList.remove('solo');
      var h='';
      for(var j=0;j<hits.length;j++){
        var r=hits[j];
        h+='<div class="it" role="option" data-j="'+j+'" aria-selected="false">'+
           '<span class="cod">'+esc(r.articolo)+' · '+esc(r.altezza)+' · '+esc(r.colore)+'</span>'+
           '<span class="ds">'+esc(r.descrizione||'')+'</span></div>'; }
      elList.innerHTML=h;
      apri(0); }); }

function apri(j){

function caricaFile(file){
  stato('Lettura di '+file.name+'…'); avanz(0.02);
  var fr=new FileReader();
  fr.onload=function(){
    var righe;
    try{
      var wb=XLSX.read(new Uint8Array(fr.result),
            {type:'array',sheets:['MODELLO'],dense:true,cellStyles:false,cellNF:false});
      var ws=wb.Sheets['MODELLO'];
      if(!ws){ stato('Nel file non c’è il foglio MODELLO.'); return; }
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
      var head=rows[1];
      righe=[];
      for(var i=2;i<rows.length;i++){
        var r=rows[i], o={};
        if(String(r[1]===undefined?'':r[1]).trim()==='') continue;
        for(var k=0;k<head.length;k++){
          var nome=head[k];
          if(!nome || o[nome]!==undefined) continue;     // la prima colonna vince
          var v=r[k];
          if(v!=='' && v!==undefined && v!==null) o[nome]=v; }
        righe.push({ id_record:String(o['ID record']||''),
                     articolo:String(o['Articolo']||''),
                     altezza:String(o['Altezza']||''),
                     colore:String(o['Colore']||''),
                     descrizione:String(o['descrizione']||''),
                     dati:o }); }
    }catch(e){ stato('Non riesco a leggere il file: '+e.message); return; }
    stato(righe.length+' schede lette. Svuoto l’archivio…'); avanz(0.1);
    sb.from('schede').delete().gte('id',0).then(function(res){
      if(res.error){ stato('Errore svuotando: '+res.error.message); return; }
      scrivi(righe,0); }); };
  fr.onerror=function(){ stato('Lettura del file non riuscita.'); };
  fr.readAsArrayBuffer(file); }

function scrivi(righe,da){
  var BLOCCO=250;
  if(da>=righe.length){
    avanz(1);
    stato('Fatto: '+righe.length+' schede caricate. Torna alla dashboard per consultarle.');
    contaSchede(); return; }
  var pezzo=righe.slice(da,da+BLOCCO);
  sb.from('schede').insert(pezzo).then(function(res){
    if(res.error){ stato('Errore in scrittura: '+res.error.message+
      ' — riprova l’aggiornamento.'); return; }
    avanz(0.1+0.9*(da+pezzo.length)/righe.length);
    stato('Caricate '+(da+pezzo.length)+' schede su '+righe.length+'…');
    scrivi(righe,da+BLOCCO); }); }

  MODO=m;
  var casa=(m===null);
  top.className = casa ? 'home' : (m==='aggiorna' ? 'agg' : '');
  elHome.hidden=!casa; corpo.hidden=casa;
  if(casa){ REC=null; hits=[]; sel=-1; elCount.textContent='';
            dashboard(); contaSchede(); return; }
  if(m==='aggiorna'){ REC=null; elCount.textContent=''; paginaAggiorna(); return; }
  REC=null; corpo.classList.remove('tot-aperto','st-aperto');
  top.classList.add('cerca');
  eseguiRicerca(); qa.focus(); }

function entra(){
  gate.hidden=true; top.hidden=false;
  sb.auth.getUser().then(function(r){
    UTENTE = (r.data && r.data.user && r.data.user.email) || ''; });
  vaiA(null); }

document.getElementById('gform').addEventListener('submit',function(e){
  e.preventDefault();
  var b=document.getElementById('g-btn'); b.disabled=true; b.textContent='Accesso…';
  document.getElementById('g-err').textContent='';
  sb.auth.signInWithPassword({ email:document.getElementById('g-mail').value.trim(),
                               password:document.getElementById('g-pwd').value })
   .then(function(res){
      b.disabled=false; b.textContent='Entra';
      if(res.error){ document.getElementById('g-err').textContent=
        'Accesso non riuscito. Controlla indirizzo e password.'; return; }
      entra(); }); });

/* Sul telefono la testata sta su una riga sola: la lente apre i campi di ricerca,
   i tre puntini raccolgono Stampa, Aggiorna archivio ed Esci. */
document.getElementById('cerca-m').addEventListener('click',function(){
  top.classList.remove('menu');
  top.classList.toggle('cerca');
  if(top.classList.contains('cerca')) qa.focus(); });
document.getElementById('menu-m').addEventListener('click',function(e){
  e.stopPropagation(); top.classList.toggle('menu'); });
document.addEventListener('click',function(e){
  if(!top.contains(e.target)) top.classList.remove('menu'); });

document.getElementById('esci').addEventListener('click',function(){
  sb.auth.signOut().then(function(){ location.reload(); }); });
document.getElementById('aggiorna').addEventListener('click',function(){ vaiA('aggiorna'); });
document.getElementById('indietro').addEventListener('click',function(){ vaiA(null); });
/* L'elenco degli articoli si puo' chiudere per dare spazio alla scheda.
   La scelta resta, cosi' non va rifatta a ogni articolo. */
var btnElenco=document.getElementById('elenco');
function applicaElenco(){
  var chiuso=false;
  try{ chiuso = localStorage.getItem('elenco_chiuso')==='1'; }catch(e){}
  corpo.classList.toggle('senza-elenco',chiuso);
  btnElenco.setAttribute('aria-pressed',chiuso?'true':'false'); }
btnElenco.addEventListener('click',function(){
  var chiuso=!corpo.classList.contains('senza-elenco');
  try{ localStorage.setItem('elenco_chiuso',chiuso?'1':'0'); }catch(e){}
  applicaElenco(); });
applicaElenco();
document.getElementById('tiles').addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.tile'):null;
  if(t && t.dataset.vista) vaiA(t.dataset.vista); });
document.getElementById('stampa').addEventListener('click',function(){
  if(REC) window.print(); });
document.getElementById('clear').addEventListener('click',function(){
  qa.value=ql.value=qc.value=qt.value=''; qa.focus(); eseguiRicerca(); });
document.getElementById('file-input').addEventListener('change',function(e){
  if(e.target.files && e.target.files[0]) caricaFile(e.target.files[0]); });
[qa,ql,qc,qt].forEach(function(el){
  el.addEventListener('input',cerca);
  el.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){ e.preventDefault(); apri(sel+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); apri(sel-1); } }); });
elList.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.it'):null;
  if(t){ top.classList.remove('cerca'); apri(+t.dataset.j); } });

sb.auth.getSession().then(function(res){ if(res.data && res.data.session) entra(); });

/* Service worker: rende l'app installabile da Chrome e la apre anche al volo.
   Se il browser non lo supporta, o siamo aperti da file locale, non succede
   niente: la pagina funziona lo stesso. */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
